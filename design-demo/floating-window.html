<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceDeck Floating Window Concept</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { color-scheme: light; --ink:#18181b; --muted:#75757c; --line:rgba(32,32,38,.1); --blue:#20aaff; --purple:#5b57d7; }
    * { box-sizing:border-box; } body { margin:0; min-width:900px; min-height:620px; overflow:hidden; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif; background:#edf0f2; }
    .desktop { position:relative; min-height:100vh; overflow:hidden; background:linear-gradient(108deg,#e0e3e6 0%,#f9fafb 44%,#e6ebee 100%); }
    .ghost-window { position:absolute; inset:54px 70px; overflow:hidden; border:1px solid rgba(255,255,255,.9); border-radius:18px; background:rgba(255,255,255,.64); box-shadow:0 17px 38px rgba(27,38,45,.12); filter:blur(5px); opacity:.8; }
    .ghost-bar { height:52px; border-bottom:1px solid #dfe2e3; background:#f8f9fa; }.ghost-lines { display:grid; gap:14px; width:58%; margin:60px auto; }.ghost-lines b { height:16px; border-radius:6px; background:#dfe3e6; }.ghost-lines b:nth-child(2) { width:83%; }.ghost-lines b:nth-child(4) { width:67%; }
    .controls { position:fixed; z-index:5; top:28px; left:50%; display:flex; align-items:center; gap:8px; transform:translateX(-50%); padding:7px; border:1px solid rgba(221,221,225,.9); border-radius:13px; background:rgba(255,255,255,.82); box-shadow:0 8px 20px rgba(0,0,0,.08); backdrop-filter:blur(12px); }
    button { font:inherit; cursor:pointer; } .mode { padding:8px 12px; border:0; border-radius:8px; background:transparent; color:#595960; font-size:13px; }.mode.active,.mode:hover { background:#171719; color:white; }
    .voice-card { position:fixed; top:50%; left:50%; display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:18px; width:clamp(380px,44vw,650px); min-height:96px; padding:17px 24px; border:1px solid rgba(202,202,207,.92); border-radius:21px; background:rgba(255,255,255,.92); box-shadow:0 18px 44px rgba(30,30,35,.18),0 2px 8px rgba(30,30,35,.08); backdrop-filter:blur(18px); transition:width .28s cubic-bezier(.2,.8,.2,1); transform:translate(-50%,-50%); }
    .signal { position:relative; isolation:isolate; align-self:center; width:62px; height:62px; border-radius:50%; animation:signal-breathe 1.1s ease-in-out infinite alternate; }.signal::before,.signal::after,.signal i,.signal i::before,.signal i::after { content:""; position:absolute; border-radius:50%; }.signal::before { inset:-15px; z-index:-1; background:radial-gradient(circle,rgba(41,177,255,.17) 0 22%,rgba(41,177,255,.065) 48%,transparent 72%); filter:blur(5px); animation:signal-aura 1.6s ease-in-out infinite alternate; }.signal::after { inset:1px; z-index:2; padding:1.5px; background:conic-gradient(from 35deg,rgba(139,225,255,.2),#62d4ff 18%,rgba(87,93,212,.62) 43%,rgba(255,255,255,.86) 62%,#34adff 82%,rgba(139,225,255,.2)); -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; animation:signal-rim 7s linear infinite; }.signal i { inset:5px; overflow:hidden; background:radial-gradient(circle at 31% 22%,rgba(255,255,255,.95) 0 4%,rgba(191,236,255,.58) 14%,rgba(41,163,244,.48) 43%,rgba(72,78,184,.55) 100%); border:1px solid rgba(255,255,255,.48); box-shadow:inset 5px 6px 11px rgba(255,255,255,.27),inset -6px -8px 12px rgba(55,55,160,.3),0 5px 17px rgba(25,151,241,.23); }.signal i::before { width:48px; height:34px; top:3px; left:-11px; background:rgba(76,205,255,.88); filter:blur(4px); transform:rotate(-16deg); animation:fluid-a 2.15s ease-in-out infinite alternate; }.signal i::after { width:43px; height:40px; right:-12px; bottom:-8px; background:rgba(90,72,224,.75); filter:blur(5px); animation:fluid-b 2.65s ease-in-out infinite alternate; }.signal .ripple { position:absolute; inset:-2px; z-index:0; border:1px solid rgba(37,169,255,.42); border-radius:50%; opacity:0; pointer-events:none; animation:signal-ripple 1.8s cubic-bezier(.18,.62,.3,1) infinite; }.signal .ripple.two { animation-delay:.6s; }.signal .ripple.three { animation-delay:1.2s; }@keyframes signal-breathe { from { transform:scale(.96); } to { transform:scale(1.04); } }@keyframes signal-aura { from { transform:scale(.88); opacity:.5; } to { transform:scale(1.12); opacity:.9; } }@keyframes signal-rim { to { transform:rotate(360deg); } }@keyframes fluid-a { from { transform:translate(-5px,4px) rotate(-16deg) scale(.92); } to { transform:translate(8px,-4px) rotate(9deg) scale(1.08); } }@keyframes fluid-b { from { transform:translate(4px,4px) scale(.94); } to { transform:translate(-8px,-7px) scale(1.1); } }@keyframes signal-ripple { 0% { transform:scale(.82); opacity:0; } 18% { opacity:.52; } 100% { transform:scale(1.48); opacity:0; } }
    .voice-copy { position:relative; display:flex; align-items:center; min-width:0; height:52px; overflow:hidden; }.transcript-clip { position:relative; z-index:2; width:100%; overflow:hidden; height:33px; color:#17171a; text-shadow:0 1px 5px rgba(255,255,255,.95); }.transcript { position:absolute; top:0; left:0; display:inline-block; white-space:nowrap; font-size:20px; font-weight:530; line-height:1.55; opacity:1; transform:translateX(0); transition:opacity .28s cubic-bezier(.2,.7,.2,1),transform .28s cubic-bezier(.2,.7,.2,1); }.transcript.entering { opacity:0; transform:translateX(12px); }.transcript.leaving { opacity:0; transform:translateX(-12px); }
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}
  </style>
</head>
<body>
  <main class="desktop"><div class="ghost-window"><div class="ghost-bar"></div><div class="ghost-lines"><b></b><b></b><b></b><b></b><b></b></div></div>
    <div class="controls"><button class="mode active" data-mode="voice">语音</button><button class="mode" data-mode="context">截图语音</button><button class="mode" data-mode="thinking">发送后</button></div>
    <section class="voice-card" id="card" aria-live="polite"><span class="signal"><b class="ripple one"></b><b class="ripple two"></b><b class="ripple three"></b><i></i></span><div class="voice-copy"><div class="transcript-clip" id="transcriptLayer"><span class="transcript"></span></div></div></section>
  </main>
  <script>
    lucide.createIcons({attrs:{width:17,height:17,"stroke-width":1.8}});
    const card=document.querySelector('#card'), transcriptLayer=document.querySelector('#transcriptLayer');
    const source='帮我整理一下这段内容，重点说明结论和下一步安排。', sourceWords=Array.from(new Intl.Segmenter('zh-CN',{granularity:'word'}).segment(source),x=>x.segment); let progress=0,timer;
    function keepWords(text){const units=Array.from(new Intl.Segmenter('zh-CN',{granularity:'word'}).segment(text),x=>x.segment);const out=[];let count=0;for(const unit of units.reverse()){const next=Array.from(unit).length;if(out.length&&count+next>20)break;out.unshift(unit);count+=next;}return out.join('')||Array.from(text).slice(-20).join('');}
    function transitionText(text){const previous=transcriptLayer.querySelector('.transcript:not(.leaving)');if(previous?.textContent===text)return;const next=document.createElement('span');next.className='transcript entering';next.textContent=text||' ';transcriptLayer.appendChild(next);requestAnimationFrame(()=>{previous?.classList.add('leaving');next.classList.remove('entering');});window.setTimeout(()=>previous?.remove(),300);}
    function animateText(){clearInterval(timer);progress=0;timer=setInterval(()=>{progress=Math.min(sourceWords.length,progress+1);transitionText(keepWords(sourceWords.slice(0,progress).join('')));if(progress===sourceWords.length)clearInterval(timer);},260);}
    function setMode(mode){document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));const thinking=mode==='thinking';card.classList.toggle('thinking',thinking);if(thinking){clearInterval(timer);transitionText('正在整理你的问题…');}else animateText();}
    document.querySelectorAll('.mode').forEach(x=>x.addEventListener('click',()=>setMode(x.dataset.mode)));
    document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.altKey&&e.key.toLowerCase()==='z'){e.preventDefault();setMode('voice');}if(e.altKey&&e.key.toLowerCase()==='x'){e.preventDefault();setMode('context');}});setMode('voice');
  </script>
</body>
</html>
